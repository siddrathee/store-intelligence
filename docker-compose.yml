version: '3.8'

services:
  api:
    build: .
    container_name: apex_intelligence_api
    ports:
      - "8000:8000"
    volumes:
      # This maps your local database file so it persists when the container stops
      - ./retail_intelligence.db:/build/retail_intelligence.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3